name: Build and release docker image

# 3-way merge

on:
  push:
    branches:
      - main

env:
  REGISTRY: gchr.io


# tagging -> build -> release
jobs:

  tagging:
    name: 태깅
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{steps.tag_version.outputs.new_version}}

  steps:
    - uses: actions/checkout@v6

    - name: 버저닝 및 태깅
      id : tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-image:
    name: 도커 이미지 빌드
    runs-on: ubuntu-latest
    needs: tagging

    steps:
      - name: 리포지터리로 체크아웃
        uses: actions/checkout@v6

      # Docker Image
      # JDK -> Gradle -> JAR
      - name: JDK 세팅
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: gradlew 권한 세팅
        run: chmod +x ./gradlew

      - name: Gradle 빌드
        run: ./gradlew build -x test


      # build/libs/xxx.jar 까지가 끝났다. 다음은 도커파일을 빌드를 해야한다.
      - name: 레지스트리에 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{env.REGISTRY}}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #build랑 push만 해주면 된다
      - name: 메타 데이터 추출
        id : meta
        uses: docker/metadata-action@v6
        with:
          images: ${{env.REGISTRY}}/${{github.actor}}/${{github.repository}}
          tags: |
            type=sha
            type=raw, value=${{needs.tagging.outputs.tag_name}}
            type=raw, value=latest

      - name: 빌드 및 이미지 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{steps.meta.output.tags}}


#docker pull ghcr.io/로 접근하도록 해준다